# CI del proceso x402 aislado (TA-2, PR-1). Solo pruebas: sin secretos, sin despliegue,
# sin release, sin caché y sin artefactos (Auditor, revisión P-4 del diseño de PR-1: P-4/L1 y P-4/L7).
# El ci.yml legacy (Node 20) no se modifica.
name: x402-ta2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  x402-teyolia:
    name: x402-teyolia (Node 22.13.1)
    # PR-6, D-P6-1 (a) (Fernando, 2026-10-24 09:21): imagen fijada para el paso de aislamiento.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: x402-teyolia
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # PR-5, decisión (b) de Fernando, PENDIENTE (dictamen de la tabla PT §9.2, PT5-04 (i)).
          # M5-V1 expone `commit` = `git rev-parse HEAD` del build. En pull_request, el checkout por
          # defecto deja HEAD en el merge commit sintético, que no existe en la historia del repo.
          # Opción recomendada por el Auditor (activa): construir el head del PR. Alternativa: exponer
          # el merge commit sintético. Para cambiarla, sustituye las DOS apariciones de la expresión
          # (aquí y en EXPECTED_COMMIT del paso M5-V1) por `${{ github.sha }}`.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Verificar Node >= 22.13 (engines)
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a!==22||b<13) { console.error('Se requiere Node 22.13+; hay ' + process.version); process.exit(1); } console.log(process.version)"

      - name: Instalar (lockfile propio, sin scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Pruebas T-10 / T-11 / kill switch (node:test)
        run: npm test

      - name: T-11 sobre dist/main.js (check-graph)
        run: npm run check:graph

      - name: Inventario 239f9dc sin cambios (inventory:check)
        run: npm run inventory:check

      # M5-V1 / OB-07 (PR-5). El push de este cambio espera el SHA final auditado (DM-6).
      - name: M5-V1 rebuild limpio y comparación con dist/build-info.json (check:dist)
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run check:dist
          node scripts/dist-manifest.mjs --print
          got="$(node -p "JSON.parse(require('fs').readFileSync('dist/build-info.json','utf8')).commit")"
          if [ "$got" != "$EXPECTED_COMMIT" ]; then echo "M5-V1: commit de build-info $got != esperado $EXPECTED_COMMIT"; exit 1; fi
          echo "M5-V1: commit de build-info = $EXPECTED_COMMIT (evento $GITHUB_EVENT_NAME)"
          d="$(mktemp -d)"; cp -R dist "$d/dist"; printf ' ' >> "$d/dist/server.js"
          if node scripts/dist-manifest.mjs --check "$d/dist"; then echo "control negativo M5-V1: un dist/ mutado NO falló"; exit 1; fi
          echo "control negativo M5-V1: dist/ mutado rechazado"

      # PR-6, D-P6-1 (a) / PM6-05: aislamiento del SO (T-12 egreso, T-12e IPC, T-13 DAC, T-06 runtime).
      # Un ÚNICO paso dentro de este job requerido (sin workflow ni check nuevo), fail-closed (sin
      # continue-on-error). Namespaces desechables (unshare --mount --net --pid) con uids numéricos
      # 2001/2002 sin /etc/passwd; el ruleset nft vive SOLO en el netns desechable; el arnés verifica que
      # el ruleset del host y /etc/passwd no cambian. npm NO se ejecuta como root (dist/ ya construido
      # arriba por el usuario del runner); sin secretos. Dependencia: nftables fijado por SHA-256 (.deb
      # oficiales de Ubuntu, versión y hashes en test/isolation/nft-pin.lock) (P6C-02: falla
      # cerrado si la versión no está disponible o el hash no coincide; sin fallback). Alternativa declarada:
      # iptables -m owner. Runbook de actualización: x402-teyolia/docs/pr6-aislamiento.md §1.1. El contrato
      # test/pr6.harness-contract.test.mjs fija el texto exacto de este paso (P6C-01) y la forma canónica de
      # todo el workflow (P6D-01). Antes del sudo se verifican los sha256 fijados del workflow y de los
      # scripts root (test/isolation/root-pins.sha256; su propio hash lo fija el contrato) y después se
      # exige el plan exacto 1..22, # pass 22 y # fail 0 (P6D-02).
      - name: Aislamiento del SO PR-6 (T-12 / T-12e / T-13 / T-06; nft fijado por sha256, fail-closed)
        run: |
          set -euo pipefail
          sha256sum --check --strict test/isolation/root-pins.sha256
          bash test/isolation/nft-pin.sh install
          echo "ImageVersion: ${ImageVersion:-?}"; echo "runner: uid=$(id -u) gid=$(id -g)"
          sudo env ImageVersion="${ImageVersion:-}" NODE_BIN="$(command -v node)" NFT_BIN=/usr/sbin/nft bash test/isolation/harness.sh | tee "$RUNNER_TEMP/pr6-arnes.log"
          grep -Fx '1..22' "$RUNNER_TEMP/pr6-arnes.log"
          grep -Fx '# pass 22' "$RUNNER_TEMP/pr6-arnes.log"
          grep -Fx '# fail 0' "$RUNNER_TEMP/pr6-arnes.log"
          grep -Fx '# arnés PR-6: OK 22/22' "$RUNNER_TEMP/pr6-arnes.log"
